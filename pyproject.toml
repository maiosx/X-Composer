# x.composer — an Omarchy plugin (see manifest.json for plugin metadata).
# Development metadata only: the plugin is installed by cloning this
# repository and at runtime needs nothing beyond the Python standard
# library and xdg-open. This is not a buildable Python package.

[project]
name = "x-composer"
version = "1.0.2"
description = "X Composer Omarchy overlay: fullscreen serif composer, browser-intent handoff by default, explicit opt-in paid API posting."
authors = [
  { name = "maiosx" }
]
requires-python = ">=3.11,<4"
dependencies = []

[tool.poetry]
package-mode = false
